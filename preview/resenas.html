<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reseñas</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400&family=Lexend:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="preview.css">
    <link rel="stylesheet" href="../assets/maripozari.css">
    <script src="../assets/maripozari-reel.js" defer></script>
  </head>
  <body>
    <maripozari-reel class="maripozari-reel maripozari-reviews">
      <div class="page-width">
        <h2 class="maripozari-reel__heading">Reseñas</h2>
        <p class="maripozari-reviews__intro">Prueba del carrusel. Cambia estos ejemplos cuando haya reseñas reales.</p>
      </div>
      <div class="page-width">
        <div class="maripozari-reel__track" data-reel-track>
          <article class="maripozari-reviews__card" data-reel-slide>
            <p class="maripozari-reviews__stars">★★★★★</p>
            <blockquote>La caja llegó sellada. Abrirla fue la mejor parte.</blockquote>
            <p class="maripozari-reviews__author">Ejemplo</p>
          </article>
          <article class="maripozari-reviews__card" data-reel-slide>
            <p class="maripozari-reviews__stars">★★★★★</p>
            <blockquote>La figura es tal cual la foto.</blockquote>
            <p class="maripozari-reviews__author">Ejemplo</p>
          </article>
          <article class="maripozari-reviews__card" data-reel-slide>
            <p class="maripozari-reviews__stars">★★★★☆</p>
            <blockquote>El sticker del bosque vino con el pedido.</blockquote>
            <p class="maripozari-reviews__author">Ejemplo</p>
          </article>
        </div>
        <div class="maripozari-reel__dots" data-reel-dots></div>
      </div>
    </maripozari-reel>
    <section class="maripozari-moment maripozari-moment--ink" style="margin-top:3rem">
      <div class="page-width"><div class="maripozari-moment__inner">
        <div><h2 class="maripozari-moment__heading">Blind box</h2><p class="maripozari-moment__text">Título en blanco.</p></div>
      </div></div>
    </section>
  </body>
</html>
