<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secciones</title>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400&family=Lexend:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="preview.css">
    <link rel="stylesheet" href="../assets/maripozari.css">
  </head>
  <body>
    <main>
      <section class="maripozari-paths">
        <div class="page-width">
          <ul class="maripozari-paths__list">
            <li><a href="#blind-box"><img class="maripozari-creature-img" src="../assets/creature-antler.png" alt="" style="width:8.8rem"><span class="maripozari-paths__index">01</span><h2>Blind box</h2><p>Llega cerrada.</p></a></li>
            <li><a href="#figuras"><img class="maripozari-creature-img" src="../assets/creature-hat.png" alt="" style="width:8.8rem"><span class="maripozari-paths__index">02</span><h2>Figuras</h2><p>A la vista.</p></a></li>
            <li><a href="#sobre"><img class="maripozari-creature-img" src="../assets/creature-flower.png" alt="" style="width:8.8rem"><span class="maripozari-paths__index">03</span><h2>Sobre</h2><p>La marca.</p></a></li>
            <li><a href="#preguntas"><img class="maripozari-creature-img" src="../assets/creature-frog.png" alt="" style="width:8.8rem"><span class="maripozari-paths__index">04</span><h2>Preguntas</h2><p>Antes de comprar.</p></a></li>
          </ul>
        </div>
      </section>
      <section id="blind-box" class="maripozari-moment">
        <div class="page-width"><div class="maripozari-moment__inner">
          <div class="maripozari-moment__media"><img class="maripozari-creature-img" src="../assets/creature-antler.png" alt="" style="width:18rem"></div>
          <div><h2 class="maripozari-moment__heading">Blind box</h2><p class="maripozari-moment__text">Eliges la serie, no el personaje.</p></div>
        </div></div>
      </section>
      <section id="figuras" class="maripozari-moment maripozari-moment--image-right">
        <div class="page-width"><div class="maripozari-moment__inner">
          <div class="maripozari-moment__media"><img class="maripozari-creature-img" src="../assets/creature-hat.png" alt="" style="width:18rem"></div>
          <div><h2 class="maripozari-moment__heading">Figuras</h2><p class="maripozari-moment__text">Lo de las fotos es lo que sale.</p></div>
        </div></div>
      </section>
      <section id="sobre" class="maripozari-about maripozari-kraft">
        <div class="page-width"><div class="maripozari-about__inner maripozari-about__inner--split">
          <div><img class="maripozari-creature-img" src="../assets/creature-flower.png" alt="" style="width:16rem"></div>
          <div><h2 class="maripozari-about__heading">Sobre</h2><p class="maripozari-about__text">La página es blanca a propósito.</p></div>
        </div></div>
      </section>
    </main>
  </body>
</html>
